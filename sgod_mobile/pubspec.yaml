name: sgod_mobile
description: "e-Brigada — DepEd SGOD mobile app for Brigada Eskwela, Adopt-A-School, and SGOD operations."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.6.0

  # Routing & state
  go_router: ^14.6.0
  provider: ^6.1.2
  get_it: ^8.0.0

  # Local database & offline
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3

  # Security & storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  # UI
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.0
  custom_refresh_indicator: ^4.0.1
  cached_network_image: ^3.4.1

  # Platform
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  package_info_plus: ^9.0.0

  # Push notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0

  # Launcher icons & splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/DepEd-ONE.png"
  adaptive_icon_background: "#003F88"
  adaptive_icon_foreground: "assets/icons/DepEd-ONE.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/DepEd-ONE.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: "assets/icons/DepEd-ONE.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/instrument-sans/InstrumentSans.ttf
        - asset: assets/fonts/instrument-sans/InstrumentSans-Italic.ttf
          style: italic
